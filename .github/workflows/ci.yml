name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Smoke-test synthetic evidence pipeline
        run: python -m codecision.cli --quick --output results/ci-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-evidence-py${{ matrix.python-version }}
          path: results/ci-smoke/

